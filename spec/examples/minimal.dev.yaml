apiVersion: aiops.duplocloud.io/v1
kind: OnboardingSpec

metadata:
  name: example-minimal-dev
  client: example
  environment: dev
  owner: devops

context:
  objective: "Minimal onboarding spec for Terraform greenfield demo."
  guardrails:
    allowApply: false
    allowImport: false
    allowStateOps: false
    requireValidate: true
    planPolicy:
      failOnDeleteOrReplace: true
    secretsPolicy:
      allowPlaintextInSpec: false

providers:
  duplocloud:
    hostEnv: DUPLO_HOST
    tokenEnv: DUPLO_TOKEN
    tenant:
      mode: existing
      tenantId: "11111111-1111-1111-1111-111111111111"   # replace with real UUID for plan
  terraform:
    requiredProviders:
      duplocloud:
        source: duplocloud/duplocloud
        version: "~> 0.11.32"
    backend:
      enabled: false
      configFile: null

inputs:
  naming:
    prefix: example-dev
    delimiter: "-"
  tags:
    Owner: DevOps
    Client: example
    Environment: dev

components:
  duplo:
    infrastructure:
      enabled: false
    s3Buckets:
      - name: artifacts
        versioning: true
        publicAccess: false
        encryption:
          mode: sse-s3
          kmsKeyArn: null
    tenantNetworkSecurityRules: []
    services: []
    rds: []
    eks: []
  terraform:
    layout:
      mode: infer
      moduleNamespace: example
    generation:
      style: modular
      createReadme: true
      emitRuntimeArtifacts: true

workflows:
  - name: terraform-greenfield
    enabled: true
    steps:
      - skill: tf.gen_modular_stack
        inputs:
          env: dev
          specPath: spec/examples/minimal.dev.yaml
