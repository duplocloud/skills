# Multi-Service Build and Push Workflow for AWS ECR via DuploCloud
#
# This workflow builds multiple Docker images and pushes them to AWS ECR
# through DuploCloud. It uses separate jobs to preserve outputs per image.
#
# Prerequisites:
#   - DuploCloud tenant configured with AWS ECR access
#   - DUPLO_TOKEN secret configured in GitHub repository settings
#   - DUPLO_HOST variable configured (your DuploCloud portal URL)
#   - ECR repositories created in DuploCloud for each service
#
# Usage:
#   - Can be triggered manually via workflow_dispatch
#   - Can be called from other workflows via workflow_call
#
name: Build and Push Docker Images (Multi-Service)

permissions:
  contents: read

on:
  # Automatic triggers (uncomment when ready to enable CI/CD automation)
  # push:
  #   branches:
  #     - main           # Build when PRs are merged to main
  #   tags:
  #     - 'v*'           # Build when version tags are pushed (e.g., v1.0.0, v2.1.3)
  #     - 'release-*'    # Or use release tags (e.g., release-2024-01-15)

  # Manual trigger - allows selecting environment and which services to build
  workflow_dispatch:
    inputs:
      environment:
        description: The DuploCloud tenant/environment to build for
        required: true
        type: choice
        options:
          - dev01
          - staging01
          - prod01
      service_name:
        description: 'Choose which service(s) to build'
        required: true
        type: choice
        options:
          - client-service-1
          - client-service-2
          - all
        default: 'all'

  # Called from other workflows (e.g., a main CI/CD pipeline)
  workflow_call:
    inputs:
      service_name:
        description: 'Name of the service to build, or "all" for all services'
        required: true
        type: string
      environment:
        description: The DuploCloud tenant/environment to build for
        required: true
        type: string
    outputs:
      service_1_uri:
        description: URI of the client-service-1 image
        value: ${{ jobs.build_service_1.outputs.image_uri }}
      service_2_uri:
        description: URI of the client-service-2 image
        value: ${{ jobs.build_service_2.outputs.image_uri }}
    secrets:
      DUPLO_TOKEN:
        description: The token to use for DuploCloud API calls
        required: true

# Environment variables needed for DuploCloud integration
# DUPLO_HOST should be set as a repository or organization variable
env:
  DUPLO_HOST: ${{ vars.DUPLO_HOST }}
  DUPLO_TOKEN: ${{ secrets.DUPLO_TOKEN }}

jobs:
  build_service_1:
    if: inputs.service_name == 'all' || inputs.service_name == 'client-service-1'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      image_uri: ${{ steps.build.outputs.uri }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: DuploCloud CI Setup
        uses: duplocloud/actions@v1.0.0 # Pin to a tag or full SHA
        env:
          DUPLO_TENANT: ${{ inputs.environment }}

      - name: Build and Push client-service-1 image
        id: build
        uses: duplocloud/actions/build-image@v1.0.0 # Pin to a tag or full SHA
        with:
          repo: your-ecr-repo-prefix/client-service-1
          dockerfile: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ github.ref_name }}
            ${{ github.sha }}

      - name: Validate build output
        run: |
          if [[ -z "${{ steps.build.outputs.uri }}" ]]; then
            echo "::error::Build completed but no image URI returned"
            exit 1
          fi

  build_service_2:
    if: inputs.service_name == 'all' || inputs.service_name == 'client-service-2'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      image_uri: ${{ steps.build.outputs.uri }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: DuploCloud CI Setup
        uses: duplocloud/actions@v1.0.0 # Pin to a tag or full SHA
        env:
          DUPLO_TENANT: ${{ inputs.environment }}

      - name: Build and Push client-service-2 image
        id: build
        uses: duplocloud/actions/build-image@v1.0.0 # Pin to a tag or full SHA
        with:
          repo: your-ecr-repo-prefix/client-service-2
          dockerfile: Dockerfile.worker
          platforms: linux/amd64
          push: true
          tags: |
            ${{ github.ref_name }}
            ${{ github.sha }}

      - name: Validate build output
        run: |
          if [[ -z "${{ steps.build.outputs.uri }}" ]]; then
            echo "::error::Build completed but no image URI returned"
            exit 1
          fi
